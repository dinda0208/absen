<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk | Absensi Mouvie Cafe</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" method="post">
    <h1 class="h4 fw-bold mb-1"><i class="bi bi-cup-hot me-1"></i> Absensi Mouvie Cafe</h1>
    <p class="hint mb-4">Masuk dengan akun yang diberikan admin.</p>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="alert alert-{{ cat }} py-2">{{ m }}</div>{% endfor %}
    {% endwith %}
    <label class="form-label">Username</label>
    <input name="username" class="form-control mb-3" required autofocus>
    <label class="form-label">Password</label>
    <input name="password" type="password" class="form-control mb-4" required>
    <button class="btn btn-brand w-100">Masuk</button>
  </form>
</div>
</body>
</html>
