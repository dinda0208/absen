<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>{% block title %}{% endblock %} | Absensi Mouvie Cafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/karyawan.css') }}"
    />
  </head>
  <body class="kar">
    {% set ep = request.endpoint %}
    <header class="ktop">
      <div class="in">
        <a class="brand" href="{{ url_for('beranda') }}"
          ><i class="bi bi-camera-reels"></i> Mouvie</a
        >
        <nav class="knav" aria-label="Menu karyawan">
          <a
            href="{{ url_for('beranda') }}"
            class="{{ 'active' if ep=='beranda' }}"
            >Beranda</a
          >
          <a href="{{ url_for('scan') }}" class="{{ 'active' if ep=='scan' }}"
            >Scan Absen</a
          >
          <a
            href="{{ url_for('rekap_karyawan') }}"
            class="{{ 'active' if ep=='rekap_karyawan' }}"
            >Rekap Absensi</a
          >
        </nav>
        <div class="me">
          <span>{{ session.nama }}</span>
          <a href="{{ url_for('logout') }}" title="Keluar" aria-label="Keluar"
            ><i class="bi bi-box-arrow-right"></i
          ></a>
        </div>
      </div>
    </header>

    <main class="kmain">
      {% with msgs = get_flashed_messages(with_categories=true) %} {% for cat, m
      in msgs %}
      <div
        class="alert alert-{{ cat }} alert-dismissible fade show"
        role="alert"
      >
        {{ m }}<button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Tutup"
        ></button>
      </div>
      {% endfor %} {% endwith %} {% block content %}{% endblock %}
    </main>

    <nav class="tabbar" aria-label="Menu utama">
      <a href="{{ url_for('beranda') }}" class="{{ 'active' if ep=='beranda' }}"
        ><i class="bi bi-house-door"></i>Beranda</a
      >
      <a href="{{ url_for('scan') }}" class="scan {{ 'active' if ep=='scan' }}"
        ><i class="bi bi-camera"></i>Scan</a
      >
      <a
        href="{{ url_for('rekap_karyawan') }}"
        class="{{ 'active' if ep=='rekap_karyawan' }}"
        ><i class="bi bi-calendar2-check"></i>Rekap</a
      >
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/camera.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
